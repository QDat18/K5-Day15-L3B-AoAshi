# Mô phỏng chi phí cho lát cắt báo thiếu món của AoAshi.
# Chạy thử 10 phiên: python run.py simulate --try
# Chạy bản nộp 50 phiên: python run.py simulate
sessions: 50
seed: 42

# Số người dùng tính năng báo thiếu món trong tháng ở từng kịch bản.
users:
  low: 10
  base: 50
  high: 100
  source: "Tự ước tính cho ba kịch bản thử nghiệm của AoAshi. Khảo sát dùng để ước lượng cơ cấu tần suất, chưa đo số người sẽ dùng tính năng."

# Khảo sát trên main tại e1bf487 có 21 dòng, trong đó 9 dòng báo giao thiếu
# ít nhất một lần trong tháng. Tỷ trọng dùng 9 dòng này, chờ Thư chốt mẫu hợp lệ.
# Giả định mỗi lần giao thiếu phát sinh một phiên AoAshi. Số lượt mỗi phiên
# là tự ước tính. Khung lấy đầu vào cho từng lượt từ benchmark.
personas:
  - name: bao_thieu_it
    share: 0.777778
    uses_per_month: 1
    turns_per_session: 1
    source: "evidence/survey/results.csv, câu 4, e1bf487. 7/9 người gặp sự cố báo 1 lần/tháng. Một phiên mỗi sự cố và một lượt mỗi phiên là tự ước tính."
  - name: bao_thieu_vua
    share: 0.111111
    uses_per_month: 2
    turns_per_session: 2
    source: "evidence/survey/results.csv, câu 4, e1bf487. 1/9 người gặp sự cố báo 2 lần/tháng. Một phiên mỗi sự cố và hai lượt mỗi phiên là tự ước tính."
  - name: bao_thieu_nhieu
    share: 0.111111
    uses_per_month: 5
    turns_per_session: 3
    source: "evidence/survey/results.csv, câu 4, e1bf487. 1/9 người gặp sự cố báo 5 lần/tháng. Một phiên mỗi sự cố và ba lượt mỗi phiên là tự ước tính."

# USD trên 1 triệu token. Dùng giá cao điểm và đầu vào cache miss cho
# cả hai model để so sánh theo một mức giá cố định.
prices:
  - model: deepseek-flash
    input: 0.30
    output: 1.20
    source: "DeepSeek API Docs, peak và input cache miss, xem 27/11/2026. https://api-docs.deepseek.com/quick_start/pricing/"
  - model: deepseek-v4-pro
    input: 1.32
    output: 3.96
    source: "DeepSeek API Docs, peak và input cache miss, xem 27/11/2026. https://api-docs.deepseek.com/quick_start/pricing/"

# Tỷ giá tùy chọn. Bản nháp báo chi phí bằng USD.
usd_to_vnd:
  rate:
  source:
