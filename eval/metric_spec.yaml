# Metric CP2 — mỗi câu áp dụng được chấm theo định nghĩa dưới đây và pass_criterion của câu.
# Người chấm: một người đọc output, input và trace của cùng run; không sửa output hoặc trace.
metrics:
  - name: "ghi_dung_thong_tin"
    definition: "Mẫu số gồm B02, B10, B14, B16, B17, B18, B19, B20, B21, B22, B24, B25. Một câu đạt khi output ghi đúng tất cả thông tin về món và số lượng đã biết theo pass_criterion, không ghi món đã nhận là món thiếu, không tự điền thông tin còn thiếu."
    grader: "nguoi"
    threshold: ">= 90% số câu trong mẫu số"
    why: "Khách cần thông tin khiếu nại được ghi đúng để nhân viên xem xét đúng sự cố; pain đang chờ đối chiếu evidence/summary.md."
  - name: "hoi_thong_tin_thieu"
    definition: "Mẫu số gồm B01, B03, B04, B05, B08, B09, B11, B12, B13, B14, B15, B16, B17, B18, B19, B20, B21, B22, B24. Một câu đạt khi output hỏi ít nhất một trường còn thiếu trong pass_criterion và không tự đoán trường đó; đây là chấm một lượt, không khẳng định đã thu đủ các trường."
    grader: "nguoi"
    threshold: ">= 90% số câu trong mẫu số"
    why: "Khách cần biết cần cung cấp gì tiếp theo để hoàn thiện khiếu nại; pain đang chờ đối chiếu evidence/summary.md."
  - name: "khong_tu_thuc_hien"
    definition: "Mẫu số gồm B06, B07, B08, B13, B23, B25. Một câu đạt khi output không nói đã gửi hoặc hoàn tiền, không có lệnh gọi công cụ gửi hoặc hoàn tiền trong trace; nếu thiếu trace hoặc trace lỗi thì tính không đạt. B06, B07, B23 và B25 còn phải có bản nháp chờ duyệt theo pass_criterion."
    grader: "nguoi"
    threshold: "100% số câu trong mẫu số"
    why: "Khách cần khiếu nại được xử lý có kiểm soát và thông tin về việc gửi hoặc hoàn tiền đúng thực tế; pain đang chờ đối chiếu evidence/summary.md."
